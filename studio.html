<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Cinema Studio | 画面工作室</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#26342e;font:15px system-ui,sans-serif}header{background:#233b32;color:white;padding:20px}header a{color:#cce5d6}main{display:grid;grid-template-columns:240px minmax(280px,1fr) 330px;gap:16px;padding:16px;max-width:1400px;margin:auto}section{background:white;border-radius:12px;padding:16px;min-width:0}h2{font-size:17px}button,input,select,textarea{font:inherit}button{background:#fff;border:1px solid #aaa;border-radius:6px;padding:8px;cursor:pointer;margin:3px}button.active{background:#285e49;color:white}label{display:block;margin:12px 0}input:not([type=checkbox]),textarea,select{width:100%;margin-top:5px}textarea{height:85px}canvas{display:block;width:min(100%,360px);margin:auto;background:#fff;box-shadow:0 4px 20px #0002}small{color:#646d66}#list button{display:block;width:100%;text-align:left}#status{padding:8px;min-height:35px}@media(max-width:950px){main{grid-template-columns:1fr}}</style><header><strong>Book Cinema Studio · 画面工作室 V0.2</strong>　<a href="index.html">基础编辑器</a></header><main><section><h2>镜头与素材</h2><div id="list"></div><button id="add">新增镜头</button><button id="del">删除</button><button id="up">上移</button><button id="down">下移</button><hr><button id="save">保存项目文件</button><label>打开项目<input type="file" id="load" accept=".json"></label><small>素材只在浏览器中处理，不上传服务器。项目文件包含图片，请自行保存。</small></section><section><h2>1080 × 1920 预览</h2><canvas id="c" width="1080" height="1920"></canvas><label>镜头进度 <input id="seek" type="range" min="0" max="1" step=".001" value="1"></label><button id="play">播放镜头</button><button id="stop">暂停</button><button id="png">导出1080P画面</button><div id="status" role="status"></div></section><section><h2>画面精修</h2><label>镜头名<input id="name"></label><label>导入彩色插画<input type="file" id="image" accept="image/png,image/jpeg,image/webp"></label><button id="clear">清除图片</button><label>标题<input id="title"></label><label>字幕<textarea id="caption"></textarea></label><label>时长（秒）<input id="duration" type="number" min="1" max="60" step=".5"></label><label>镜头运动<select id="motion"><option value="none">静止</option><option value="in">缓慢推进</option><option value="out">缓慢拉远</option><option value="pan">横向移动</option></select></label><label>揭示方式<select id="reveal"><option value="none">直接显示</option><option value="wipe">从左向右揭示</option><option value="fade">淡入</option></select></label><label>缩放<input id="zoom" type="range" min="1" max="2" step=".01"></label><label>横向位置<input id="x" type="range" min="-1" max="1" step=".01"></label><label>纵向位置<input id="y" type="range" min="-1" max="1" step=".01"></label><label>背景<input id="bg" type="color"></label><label>字幕颜色<input id="ink" type="color"></label><label><input id="show" type="checkbox"> 显示字幕</label><small>揭示效果是遮罩动画，并非真实逐笔描摹。</small></section></main><script>
"use strict";const $=x=>document.getElementById(x),c=$("c"),g=c.getContext("2d"),W=c.width,H=c.height;
const defaults={name:"新镜头",title:"",caption:"",duration:6,motion:"in",reveal:"none",zoom:1,x:0,y:0,bg:"#faf5e9",ink:"#26342e",show:true,image:""};
const clamp=(x,a,b,d)=>Number.isFinite(Number(x))?Math.min(b,Math.max(a,Number(x))):d;
function clean(s){s=s||{};let r={...defaults};for(const k of ["name","title","caption"])r[k]=String(s[k]??r[k]).slice(0,500);for(const k of ["bg","ink"])if(/^#[0-9a-f]{6}$/i.test(s[k]))r[k]=s[k];r.duration=clamp(s.duration,1,60,6);r.zoom=clamp(s.zoom,1,2,1);r.x=clamp(s.x,-1,1,0);r.y=clamp(s.y,-1,1,0);r.show=s.show!==false;if(["none","in","out","pan"].includes(s.motion))r.motion=s.motion;if(["none","wipe","fade"].includes(s.reveal))r.reveal=s.reveal;if(/^data:image\/(png|jpeg|webp);base64,/.test(s.image||""))r.image=s.image;return r}
let scenes=[clean({name:"镜头 01",title:"在此添加你的插画",caption:"导入已审核的脚本与画面素材"})],i=0,p=1,raf=0,im=null,token=0;
const keys=["name","title","caption","duration","motion","reveal","zoom","x","y","bg","ink","show"];
function lines(t,max){let a=Array.from(t),out=[];while(a.length&&out.length<4)out.push(a.splice(0,max).join(""));return out}
function draw(){let s=scenes[i];g.fillStyle=s.bg;g.fillRect(0,0,W,H);if(im){g.save();g.beginPath();g.rect(0,240,W,s.show?1300:1600);g.clip();let q=s.motion==="in"?1+.15*p:s.motion==="out"?1.15-.15*p:1;let z=Math.max(W/im.width,1300/im.height)*s.zoom*q;let w=im.width*z,h=im.height*z;let x=(W-w)/2+s.x*Math.max(0,w-W)/2+(s.motion==="pan"?(p-.5)*Math.min(120,Math.max(0,w-W)):0),y=890-h/2+s.y*Math.max(0,h-1300)/2;if(s.reveal==="wipe"){g.beginPath();g.rect(0,240,W*Math.min(1,p*2),1600);g.clip()}if(s.reveal==="fade")g.globalAlpha=Math.min(1,p*3);g.drawImage(im,x,y,w,h);g.restore()}else{g.fillStyle="#d7d3c8";g.fillRect(70,340,940,1000);g.fillStyle="#58675d";g.font="36px sans-serif";g.textAlign="center";g.fillText("导入插画后预览",540,850)}g.fillStyle=s.ink;g.textAlign="center";g.font="bold 60px sans-serif";lines(s.title,15).slice(0,2).forEach((v,j)=>g.fillText(v,540,120+j*75));if(s.show){g.fillStyle=s.bg;g.fillRect(0,1540,W,380);g.fillStyle=s.ink;g.font="44px sans-serif";lines(s.caption,21).forEach((v,j)=>g.fillText(v,540,1630+j*62))}$("seek").value=p}
function list(){let l=$("list");l.replaceChildren();scenes.forEach((s,j)=>{let b=document.createElement("button");b.textContent=(j+1)+". "+s.name+" · "+s.duration+"s";b.className=i===j?"active":"";b.onclick=()=>select(j);l.append(b)})}
function loadImage(){let t=++token;im=null;draw();if(!scenes[i].image)return;let img=new Image();img.onload=()=>{if(t===token){im=img;draw()}};img.onerror=()=>{$("status").textContent="图片读取失败"};img.src=scenes[i].image}
function select(j){cancelAnimationFrame(raf);i=j;p=1;keys.forEach(k=>{if(k==="show")$(k).checked=scenes[i][k];else $(k).value=scenes[i][k]});list();loadImage()}
keys.forEach(k=>$(k).oninput=()=>{scenes[i]=clean({...scenes[i],[k]:k==="show"?$(k).checked:$(k).value});list();draw()});
$("image").onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>15*1024*1024){alert("图片须小于15MB");return}let target=scenes[i];let reader=new FileReader();reader.onload=()=>{if(!/^data:image\/(png|jpeg|webp);base64,/.test(reader.result)){alert("不支持的图片");return}target.image=reader.result;if(scenes[i]===target)loadImage()};reader.readAsDataURL(f);e.target.value=""};
$("clear").onclick=()=>{scenes[i].image="";loadImage()};$("add").onclick=()=>{scenes.splice(i+1,0,clean({}));select(i+1)};$("del").onclick=()=>{if(scenes.length>1){scenes.splice(i,1);select(Math.min(i,scenes.length-1))}};function move(n){let j=i+n;if(j>=0&&j<scenes.length){[scenes[i],scenes[j]]=[scenes[j],scenes[i]];select(j)}}$("up").onclick=()=>move(-1);$("down").onclick=()=>move(1);
$("seek").oninput=()=>{cancelAnimationFrame(raf);p=Number($("seek").value);draw()};$("play").onclick=()=>{cancelAnimationFrame(raf);let start=performance.now();function frame(t){p=Math.min(1,(t-start)/1000/scenes[i].duration);draw();if(p<1)raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)};$("stop").onclick=()=>cancelAnimationFrame(raf);
function dl(b,n){let a=document.createElement("a"),u=URL.createObjectURL(b);a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}$("png").onclick=()=>c.toBlob(b=>b&&dl(b,"scene-"+(i+1)+".png"));$("save").onclick=()=>dl(new Blob([JSON.stringify({version:2,scenes})],{type:"application/json"}),"cinema-project-v2.json");$("load").onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let o=JSON.parse(await f.text());if(o.version!==2||!Array.isArray(o.scenes)||!o.scenes.length||o.scenes.length>100)throw Error("需要V2项目文件（1至100镜头）");scenes=o.scenes.map(clean);select(0)}catch(err){alert(err.message)}e.target.value=""};select(0);
</script></html>
